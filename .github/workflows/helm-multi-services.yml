name: Helm Multi-Services – Package & Deploy

on:
  push:
    branches: [testing]
    paths:
      - "charts/multi-services/**"
      - ".github/workflows/helm-multi-services.yml"
  workflow_dispatch:
    inputs:
      service_count:
        description: "Number of services to create (default: 20)"
        required: false
        default: "20"
      name_prefix:
        description: "Service name prefix (default: readonly)"
        required: false
        default: "readonly"
      chart_version:
        description: "Chart version override (leave blank to auto-bump)"
        required: false
        default: ""

env:
  DUPLO_HOST: https://perf.duplocloud.net
  DUPLO_TENANT: mj4
  TENANT_ID: 4c211724-a237-4cc7-ad4f-87edb3da18b7
  CHART_DIR: charts/multi-services
  FLUX_NAMESPACE: duploservices-mj4
  CERT_ARN: arn:aws:acm:us-east-2:309617244960:certificate/e48470c9-502b-48e4-9e08-acd376b39741

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Package chart
  # ─────────────────────────────────────────────────────────────────────────────
  package:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Resolve chart version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.chart_version }}" ]; then
            VERSION="${{ github.event.inputs.chart_version }}"
          else
            CURRENT=$(grep '^version:' $CHART_DIR/Chart.yaml | awk '{print $2}')
            MAJOR=$(echo $CURRENT | cut -d. -f1)
            MINOR=$(echo $CURRENT | cut -d. -f2)
            PATCH=$(echo $CURRENT | cut -d. -f3)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            sed -i "s/^version:.*/version: $VERSION/" $CHART_DIR/Chart.yaml
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Chart version: $VERSION"

      - name: Package Helm chart
        run: |
          mkdir -p /tmp/charts
          helm package $CHART_DIR --version ${{ steps.version.outputs.version }} \
            --destination /tmp/charts/
          ls -la /tmp/charts/

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: /tmp/charts/*.tgz

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy via helm upgrade --install
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to mj4
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Download chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: /tmp/charts/

      # ── Install duplo-jit and build kubeconfig ────────────────────────────────
      - name: Build kubeconfig for mj4
        run: |
          curl -sL https://github.com/duplocloud/duplo-jit/releases/latest/download/duplo-jit-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin/
          chmod +x /usr/local/bin/duplo-jit

          # Get EKS cluster endpoint from DuploCloud API
          pip install requests -q
          CLUSTER_ENDPOINT=$(python3 - <<'PY'
          import os, requests, sys
          headers = {"Authorization": f"Bearer {os.environ['DUPLO_TOKEN']}"}
          r = requests.get(
            f"{os.environ['DUPLO_HOST']}/v3/admin/plans",
            headers=headers, timeout=30
          )
          for plan in r.json():
              ep = (plan.get("MetaData") or {}).get("K8sConfig", {}).get("ApiServer", "")
              if ep:
                  print(ep)
                  sys.exit(0)
          print("", file=sys.stderr); sys.exit(1)
          PY
          )
          echo "Cluster endpoint: $CLUSTER_ENDPOINT"

          cat > /tmp/kubeconfig.yaml <<KUBEEOF
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: ${CLUSTER_ENDPOINT}
              insecure-skip-tls-verify: true
            name: mj4-cluster
          contexts:
          - context:
              cluster: mj4-cluster
              namespace: ${FLUX_NAMESPACE}
              user: mj4-user
            name: mj4
          current-context: mj4
          users:
          - name: mj4-user
            user:
              exec:
                apiVersion: client.authentication.k8s.io/v1beta1
                command: duplo-jit
                args:
                - k8s
                - -host
                - ${DUPLO_HOST}
                - -token
                - ${DUPLO_TOKEN}
                - -tenant
                - ${DUPLO_TENANT}
          KUBEEOF
          echo "KUBECONFIG=/tmp/kubeconfig.yaml" >> $GITHUB_ENV
        env:
          DUPLO_TOKEN: ${{ secrets.DUPLO_TOKEN }}

      # ── Deploy with helm upgrade --install ───────────────────────────────────
      - name: Deploy multi-services
        run: |
          SERVICE_COUNT="${{ github.event.inputs.service_count || '20' }}"
          NAME_PREFIX="${{ github.event.inputs.name_prefix || 'readonly' }}"
          CHART_FILE=$(ls /tmp/charts/multi-services-*.tgz)

          helm upgrade --install multi-services "$CHART_FILE" \
            --namespace ${{ env.FLUX_NAMESPACE }} \
            --set serviceCount=${SERVICE_COUNT} \
            --set namePrefix=${NAME_PREFIX} \
            --set duploLB.enabled=false \
            --wait --timeout=180s

      # ── Print final status ────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "=== Helm release ==="
          helm list -n ${{ env.FLUX_NAMESPACE }}
          echo ""
          echo "=== Deployments ==="
          kubectl get deployments -n ${{ env.FLUX_NAMESPACE }} --no-headers | grep -v chartmuseum
