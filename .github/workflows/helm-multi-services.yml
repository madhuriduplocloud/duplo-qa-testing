name: Helm Multi-Services – Package & Deploy

on:
  push:
    branches: [testing]
    paths:
      - "charts/multi-services/**"
      - ".github/workflows/helm-multi-services.yml"
  workflow_dispatch:
    inputs:
      service_count:
        description: "Number of services to create (default: 20)"
        required: false
        default: "20"
      name_prefix:
        description: "Service name prefix (default: readonly)"
        required: false
        default: "readonly"
      chart_version:
        description: "Chart version override (leave blank to auto-bump)"
        required: false
        default: ""

env:
  DUPLO_HOST: https://perf.duplocloud.net
  DUPLO_TENANT: mj4
  TENANT_ID: 4c211724-a237-4cc7-ad4f-87edb3da18b7
  CHART_DIR: charts/multi-services
  FLUX_NAMESPACE: duploservices-mj4
  CERT_ARN: arn:aws:acm:us-east-2:309617244960:certificate/e48470c9-502b-48e4-9e08-acd376b39741

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Package chart
  # ─────────────────────────────────────────────────────────────────────────────
  package:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Resolve chart version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.chart_version }}" ]; then
            VERSION="${{ github.event.inputs.chart_version }}"
          else
            CURRENT=$(grep '^version:' $CHART_DIR/Chart.yaml | awk '{print $2}')
            MAJOR=$(echo $CURRENT | cut -d. -f1)
            MINOR=$(echo $CURRENT | cut -d. -f2)
            PATCH=$(echo $CURRENT | cut -d. -f3)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            sed -i "s/^version:.*/version: $VERSION/" $CHART_DIR/Chart.yaml
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Chart version: $VERSION"

      - name: Package Helm chart
        run: |
          mkdir -p /tmp/charts
          helm package $CHART_DIR --version ${{ steps.version.outputs.version }} \
            --destination /tmp/charts/
          ls -la /tmp/charts/

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: /tmp/charts/*.tgz

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy via helm upgrade --install
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to mj4
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Download chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: /tmp/charts/

      # ── Build kubeconfig via duploctl ─────────────────────────────────────────
      - name: Build kubeconfig for mj4
        run: |
          pip install duplocloud-client -q

          # duploctl jit k8s returns ExecCredential JSON
          duploctl --host ${{ env.DUPLO_HOST }} \
            --token ${{ secrets.DUPLO_TOKEN }} \
            --tenant ${{ env.DUPLO_TENANT }} \
            jit k8s > /tmp/cred.json

          # Parse fields
          SERVER=$(python3 -c "import json; d=json.load(open('/tmp/cred.json')); print(d['spec']['cluster']['server'])")
          CA_DATA=$(python3 -c "import json; d=json.load(open('/tmp/cred.json')); print(d['spec']['cluster']['certificate-authority-data'])")
          TOKEN=$(python3 -c "import json; d=json.load(open('/tmp/cred.json')); print(d['status']['token'])")

          # Build kubeconfig using kubectl config commands
          export KUBECONFIG=/tmp/kubeconfig.yaml
          echo "$CA_DATA" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster mj4-cluster --server="$SERVER" \
            --certificate-authority=/tmp/ca.crt --embed-certs=true
          kubectl config set-credentials mj4-user --token="$TOKEN"
          kubectl config set-context mj4 --cluster=mj4-cluster \
            --user=mj4-user --namespace=${{ env.FLUX_NAMESPACE }}
          kubectl config use-context mj4

          echo "KUBECONFIG=/tmp/kubeconfig.yaml" >> $GITHUB_ENV
          kubectl config current-context

      # ── Deploy with helm upgrade --install ───────────────────────────────────
      - name: Deploy multi-services
        run: |
          SERVICE_COUNT="${{ github.event.inputs.service_count || '20' }}"
          NAME_PREFIX="${{ github.event.inputs.name_prefix || 'readonly' }}"
          CHART_FILE=$(ls /tmp/charts/multi-services-*.tgz)

          helm upgrade --install multi-services "$CHART_FILE" \
            --namespace ${{ env.FLUX_NAMESPACE }} \
            --set serviceCount=${SERVICE_COUNT} \
            --set namePrefix=${NAME_PREFIX} \
            --set duploLB.enabled=false \
            --wait --timeout=180s

      # ── Print final status ────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "=== Helm release ==="
          helm list -n ${{ env.FLUX_NAMESPACE }}
          echo ""
          echo "=== Deployments ==="
          kubectl get deployments -n ${{ env.FLUX_NAMESPACE }} --no-headers | grep -v chartmuseum
