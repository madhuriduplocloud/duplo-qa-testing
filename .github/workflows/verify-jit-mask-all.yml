name: Verify DUPLO-42934 jit credential masking (ALL environments, before and after)

# Single consolidated workflow covering every scenario tested for DUPLO-42934 /
# DUPLO-43815, across both environments:
#   orig-*  jobs -> oneclick.duplocloud.net, tenant maja2707 (mj-2 for argo_wf)
#   nov-*   jobs -> qa-aws.duplocloud.net,   tenant maja2707 (mj-2 for argo_wf)
# Every scenario has a before-fix job (pinned to the commit right before the
# fix, d6497fbc) and an after-fix job (main). aws/gcp use the real downstream
# consumer where one exists (aws-actions/configure-aws-credentials); everything
# else uses a plain echo step standing in for "a downstream step logs this".

on:
  workflow_dispatch: {}

jobs:

  # ---------- ORIGINAL ENVIRONMENT (oneclick.duplocloud.net / maja2707) ----------

  orig-aws-before-fix:
    name: "[orig] aws BEFORE fix (should LEAK creds)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "git+https://github.com/duplocloud/duploctl.git@d6497fbc21d4f17fd252d63d639ec1402d56839a"
      - id: jit
        run: |
          duploctl jit aws --host "${{ secrets.DUPLO_HOST }}" --token "${{ secrets.DUPLO_TOKEN }}" --tenant "${{ secrets.DUPLO_TENANT }}" \
            -o env -q '{AWS_ACCESS_KEY_ID: AccessKeyId, AWS_SECRET_ACCESS_KEY: SecretAccessKey, AWS_SESSION_TOKEN: SessionToken, AWS_REGION: Region}' >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ steps.jit.outputs.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ steps.jit.outputs.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ steps.jit.outputs.AWS_SESSION_TOKEN }}
          aws-region: ${{ steps.jit.outputs.AWS_REGION }}
      - run: aws sts get-caller-identity

  orig-aws-after-fix:
    name: "[orig] aws AFTER fix (should be masked ***)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "git+https://github.com/duplocloud/duploctl.git@main"
      - id: jit
        run: |
          duploctl jit aws --host "${{ secrets.DUPLO_HOST }}" --token "${{ secrets.DUPLO_TOKEN }}" --tenant "${{ secrets.DUPLO_TENANT }}" \
            -o env -q '{AWS_ACCESS_KEY_ID: AccessKeyId, AWS_SECRET_ACCESS_KEY: SecretAccessKey, AWS_SESSION_TOKEN: SessionToken, AWS_REGION: Region}' >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ steps.jit.outputs.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ steps.jit.outputs.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ steps.jit.outputs.AWS_SESSION_TOKEN }}
          aws-region: ${{ steps.jit.outputs.AWS_REGION }}
      - run: aws sts get-caller-identity

