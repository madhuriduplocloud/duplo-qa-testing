name: Verify DUPLO-42934 jit credential masking

# Each credential type gets a before-fix job (pinned to the commit right before
# the fix, d6497fbc) and an after-fix job (main, which has the fix merged).
# For aws, the real-world consumer (aws-actions/configure-aws-credentials) is
# used since that's the exact scenario from the bug report. For gcp/argo_wf/
# k8s/token there's no equivalent standard Action, so a plain `echo` step
# stands in for "some downstream step logs this value" — GitHub's masking
# works by matching the literal string anywhere in the log afterward, so an
# echo is just as valid a proof as a real action's `with:` block.

on:
  workflow_dispatch: {}

jobs:
  aws-before-fix:
    name: "aws BEFORE fix (should LEAK creds in logs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (pre-fix commit)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@d6497fbc21d4f17fd252d63d639ec1402d56839a"

      - name: Get JIT AWS creds
        id: jit
        run: |
          duploctl jit aws \
            --host "${{ secrets.DUPLO_HOST }}" \
            --token "${{ secrets.DUPLO_TOKEN }}" \
            --tenant "${{ secrets.DUPLO_TENANT }}" \
            -o env \
            -q '{AWS_ACCESS_KEY_ID: AccessKeyId, AWS_SECRET_ACCESS_KEY: SecretAccessKey, AWS_SESSION_TOKEN: SessionToken, AWS_REGION: Region}' \
            >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ steps.jit.outputs.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ steps.jit.outputs.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ steps.jit.outputs.AWS_SESSION_TOKEN }}
          aws-region: ${{ steps.jit.outputs.AWS_REGION }}

      - name: Prove creds still work
        run: aws sts get-caller-identity

  aws-after-fix:
    name: "aws AFTER fix (creds should be masked ***)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (main, post-fix)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@main"

      - name: Get JIT AWS creds
        id: jit
        run: |
          duploctl jit aws \
            --host "${{ secrets.DUPLO_HOST }}" \
            --token "${{ secrets.DUPLO_TOKEN }}" \
            --tenant "${{ secrets.DUPLO_TENANT }}" \
            -o env \
            -q '{AWS_ACCESS_KEY_ID: AccessKeyId, AWS_SECRET_ACCESS_KEY: SecretAccessKey, AWS_SESSION_TOKEN: SessionToken, AWS_REGION: Region}' \
            >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ steps.jit.outputs.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ steps.jit.outputs.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ steps.jit.outputs.AWS_SESSION_TOKEN }}
          aws-region: ${{ steps.jit.outputs.AWS_REGION }}

      - name: Prove creds still work
        run: aws sts get-caller-identity

  token-before-fix:
    name: "token BEFORE fix (should LEAK JWT in logs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (pre-fix commit)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@d6497fbc21d4f17fd252d63d639ec1402d56839a"

      - name: Get JIT token
        id: jit
        run: |
          duploctl jit token \
            --host "${{ secrets.DUPLO_HOST }}" \
            --token "${{ secrets.DUPLO_TOKEN }}" \
            --tenant "${{ secrets.DUPLO_TENANT }}" \
            -o env \
            -q '{JWT_TOKEN: token}' \
            >> "$GITHUB_OUTPUT"

      - name: Simulate downstream consumer logging the token
        run: echo "consumer received JWT_TOKEN=${{ steps.jit.outputs.JWT_TOKEN }}"

  token-after-fix:
    name: "token AFTER fix (JWT should be masked ***)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (main, post-fix)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@main"

      - name: Get JIT token
        id: jit
        run: |
          duploctl jit token \
            --host "${{ secrets.DUPLO_HOST }}" \
            --token "${{ secrets.DUPLO_TOKEN }}" \
            --tenant "${{ secrets.DUPLO_TENANT }}" \
            -o env \
            -q '{JWT_TOKEN: token}' \
            >> "$GITHUB_OUTPUT"

      - name: Simulate downstream consumer logging the token
        run: echo "consumer received JWT_TOKEN=${{ steps.jit.outputs.JWT_TOKEN }}"

  gcp-before-fix:
    name: "gcp BEFORE fix (should LEAK token in logs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (pre-fix commit)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@d6497fbc21d4f17fd252d63d639ec1402d56839a"

      - name: Get JIT GCP token
        id: jit
        run: |
          duploctl jit gcp \
            --host "${{ secrets.DUPLO_HOST_GCP }}" \
            --token "${{ secrets.DUPLO_TOKEN_GCP }}" \
            --tenant "${{ secrets.DUPLO_TENANT_GCP }}" \
            --admin \
            -o env \
            -q '{CLOUDSDK_AUTH_ACCESS_TOKEN: Token}' \
            >> "$GITHUB_OUTPUT"

      - name: Simulate downstream consumer logging the token
        run: echo "consumer received CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.jit.outputs.CLOUDSDK_AUTH_ACCESS_TOKEN }}"

  gcp-after-fix:
    name: "gcp AFTER fix (token should be masked ***)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (main, post-fix)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@main"

      - name: Get JIT GCP token
        id: jit
        run: |
          duploctl jit gcp \
            --host "${{ secrets.DUPLO_HOST_GCP }}" \
            --token "${{ secrets.DUPLO_TOKEN_GCP }}" \
            --tenant "${{ secrets.DUPLO_TENANT_GCP }}" \
            --admin \
            -o env \
            -q '{CLOUDSDK_AUTH_ACCESS_TOKEN: Token}' \
            >> "$GITHUB_OUTPUT"

      - name: Simulate downstream consumer logging the token
        run: echo "consumer received CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.jit.outputs.CLOUDSDK_AUTH_ACCESS_TOKEN }}"

  argo-before-fix:
    name: "argo_wf BEFORE fix (should LEAK token in logs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (pre-fix commit)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@d6497fbc21d4f17fd252d63d639ec1402d56839a"

      - name: Get JIT Argo Workflows token
        id: jit
        run: |
          duploctl jit argo_wf \
            --host "${{ secrets.DUPLO_HOST }}" \
            --token "${{ secrets.DUPLO_TOKEN }}" \
            --tenant "${{ secrets.DUPLO_TENANT_ARGO }}" \
            -o env \
            -q '{ARGO_TOKEN: Token}' \
            >> "$GITHUB_OUTPUT"

      - name: Simulate downstream consumer logging the token
        run: echo "consumer received ARGO_TOKEN=${{ steps.jit.outputs.ARGO_TOKEN }}"

  argo-after-fix:
    name: "argo_wf AFTER fix (token should be masked ***)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (main, post-fix)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@main"

      - name: Get JIT Argo Workflows token
        id: jit
        run: |
          duploctl jit argo_wf \
            --host "${{ secrets.DUPLO_HOST }}" \
            --token "${{ secrets.DUPLO_TOKEN }}" \
            --tenant "${{ secrets.DUPLO_TENANT_ARGO }}" \
            -o env \
            -q '{ARGO_TOKEN: Token}' \
            >> "$GITHUB_OUTPUT"

      - name: Simulate downstream consumer logging the token
        run: echo "consumer received ARGO_TOKEN=${{ steps.jit.outputs.ARGO_TOKEN }}"

  k8s-before-fix:
    name: "k8s BEFORE fix (should LEAK token in logs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (pre-fix commit)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@d6497fbc21d4f17fd252d63d639ec1402d56839a"

      - name: Get JIT k8s exec credential
        id: jit
        run: |
          duploctl jit k8s \
            --host "${{ secrets.DUPLO_HOST }}" \
            --token "${{ secrets.DUPLO_TOKEN }}" \
            --tenant "${{ secrets.DUPLO_TENANT }}" \
            -o env \
            -q '{K8S_TOKEN: status.token}' \
            >> "$GITHUB_OUTPUT"

      - name: Simulate downstream consumer logging the token
        run: echo "consumer received K8S_TOKEN=${{ steps.jit.outputs.K8S_TOKEN }}"

  k8s-after-fix:
    name: "k8s AFTER fix (token should be masked ***)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (main, post-fix)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@main"

      - name: Get JIT k8s exec credential
        id: jit
        run: |
          duploctl jit k8s \
            --host "${{ secrets.DUPLO_HOST }}" \
            --token "${{ secrets.DUPLO_TOKEN }}" \
            --tenant "${{ secrets.DUPLO_TENANT }}" \
            -o env \
            -q '{K8S_TOKEN: status.token}' \
            >> "$GITHUB_OUTPUT"

      - name: Simulate downstream consumer logging the token
        run: echo "consumer received K8S_TOKEN=${{ steps.jit.outputs.K8S_TOKEN }}"

  # TC09: k8s_context is a separate public command from k8s. k8s() wraps
  # k8s_context()'s raw API response and masks the token before returning;
  # k8s_context() itself returns that raw response (including the same
  # Token field) with no _mask_in_ci call anywhere in the method. So this
  # should leak in BOTH the before-fix and after-fix jobs -- there's no fix
  # for this path to verify.
  k8s-context-before-fix:
    name: "k8s_context BEFORE fix (should LEAK token in logs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (pre-fix commit)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@d6497fbc21d4f17fd252d63d639ec1402d56839a"

      - name: Get raw JIT k8s context
        id: jit
        run: |
          duploctl jit k8s_context \
            --host "${{ secrets.DUPLO_HOST }}" \
            --token "${{ secrets.DUPLO_TOKEN }}" \
            --tenant "${{ secrets.DUPLO_TENANT }}" \
            -o env \
            -q '{K8S_CONTEXT_TOKEN: Token}' \
            >> "$GITHUB_OUTPUT"

      - name: Simulate downstream consumer logging the token
        run: echo "consumer received K8S_CONTEXT_TOKEN=${{ steps.jit.outputs.K8S_CONTEXT_TOKEN }}"

  k8s-context-after-fix:
    name: "k8s_context AFTER fix (STILL LEAKS -- gap, not fixed)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (main, post-fix)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@main"

      - name: Get raw JIT k8s context
        id: jit
        run: |
          duploctl jit k8s_context \
            --host "${{ secrets.DUPLO_HOST }}" \
            --token "${{ secrets.DUPLO_TOKEN }}" \
            --tenant "${{ secrets.DUPLO_TENANT }}" \
            -o env \
            -q '{K8S_CONTEXT_TOKEN: Token}' \
            >> "$GITHUB_OUTPUT"

      - name: Simulate downstream consumer logging the token
        run: echo "consumer received K8S_CONTEXT_TOKEN=${{ steps.jit.outputs.K8S_CONTEXT_TOKEN }}"

  # TC09 needs unambiguous proof, not "it was masked, probably because it
  # happened to match a secret already". GitHub's automatic redaction
  # triggers because this job's own YAML text contains `secrets.DUPLO_TOKEN`.
  # These two jobs never write that expression at all -- stage-creds (which
  # DOES reference the secrets, so it's masked for its own steps only)
  # writes them to files and uploads them as a build artifact; the isolated
  # jobs below download that artifact and read the values from disk. Since
  # THEIR OWN YAML never evaluates secrets.*, GitHub has nothing to hide in
  # their logs -- whatever duploctl (running main, i.e. the fix already
  # applied) actually prints is exactly what would show up in a real
  # consumer's log. This isolates "did the fix's masking code run" from
  # "did GitHub's own secret-matching coincidentally help us".
  stage-creds:
    name: "Stage creds as an artifact (breaks GitHub's auto-redaction link)"
    runs-on: ubuntu-latest
    steps:
      - name: Write creds to files
        run: |
          mkdir -p creds
          printf '%s' "${{ secrets.DUPLO_HOST }}" > creds/host.txt
          printf '%s' "${{ secrets.DUPLO_TOKEN }}" > creds/token.txt
          printf '%s' "${{ secrets.DUPLO_TENANT }}" > creds/tenant.txt

      - uses: actions/upload-artifact@v4
        with:
          name: duplo-creds
          path: creds/
          retention-days: 1

  isolated-k8s-fixed:
    name: "ISOLATED k8s (fixed) -- control: should still mask via its own code"
    needs: stage-creds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (main, post-fix)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@main"

      - uses: actions/download-artifact@v4
        with:
          name: duplo-creds
          path: creds/

      - name: Get JIT k8s exec credential (creds read from file, not secrets.*)
        id: jit
        run: |
          duploctl jit k8s \
            --host "$(cat creds/host.txt)" \
            --token "$(cat creds/token.txt)" \
            --tenant "$(cat creds/tenant.txt)" \
            -o env \
            -q '{K8S_TOKEN: status.token}' \
            >> "$GITHUB_OUTPUT"

      - name: Simulate downstream consumer logging the token
        run: echo "consumer received K8S_TOKEN=${{ steps.jit.outputs.K8S_TOKEN }}"

  isolated-k8s-context-unfixed:
    name: "ISOLATED k8s_context (gap) -- should LEAK, proves the gap on main"
    needs: stage-creds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (main, post-fix)
        run: pip install "git+https://github.com/duplocloud/duploctl.git@main"

      - uses: actions/download-artifact@v4
        with:
          name: duplo-creds
          path: creds/

      - name: Get raw JIT k8s context (creds read from file, not secrets.*)
        id: jit
        run: |
          duploctl jit k8s_context \
            --host "$(cat creds/host.txt)" \
            --token "$(cat creds/token.txt)" \
            --tenant "$(cat creds/tenant.txt)" \
            -o env \
            -q '{K8S_CONTEXT_TOKEN: Token}' \
            >> "$GITHUB_OUTPUT"

      - name: Simulate downstream consumer logging the token
        run: echo "consumer received K8S_CONTEXT_TOKEN=${{ steps.jit.outputs.K8S_CONTEXT_TOKEN }}"
