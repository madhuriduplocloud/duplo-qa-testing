name: Verify DUPLO-42934 jit credential masking

on:
  workflow_dispatch: {}

jobs:
  before-fix:
    name: "BEFORE fix (should LEAK creds in logs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (pre-fix commit)
        run: pip install "duploctl @ git+https://github.com/duplocloud/duploctl.git@d6497fbc21d4f17fd252d63d639ec1402d56839a"

      - name: Get JIT AWS creds
        id: jit
        run: |
          duploctl jit aws \
            --host "${{ secrets.DUPLO_HOST }}" \
            --token "${{ secrets.DUPLO_TOKEN }}" \
            --tenant "${{ secrets.DUPLO_TENANT }}" \
            -o env \
            -q '{AWS_ACCESS_KEY_ID: AccessKeyId, AWS_SECRET_ACCESS_KEY: SecretAccessKey, AWS_SESSION_TOKEN: SessionToken, AWS_REGION: Region}' \
            >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ steps.jit.outputs.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ steps.jit.outputs.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ steps.jit.outputs.AWS_SESSION_TOKEN }}
          aws-region: ${{ steps.jit.outputs.AWS_REGION }}

      - name: Prove creds still work
        run: aws sts get-caller-identity

  after-fix:
    name: "AFTER fix (creds should be masked ***)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install duploctl (main, post-fix)
        run: pip install "duploctl @ git+https://github.com/duplocloud/duploctl.git@main"

      - name: Get JIT AWS creds
        id: jit
        run: |
          duploctl jit aws \
            --host "${{ secrets.DUPLO_HOST }}" \
            --token "${{ secrets.DUPLO_TOKEN }}" \
            --tenant "${{ secrets.DUPLO_TENANT }}" \
            -o env \
            -q '{AWS_ACCESS_KEY_ID: AccessKeyId, AWS_SECRET_ACCESS_KEY: SecretAccessKey, AWS_SESSION_TOKEN: SessionToken, AWS_REGION: Region}' \
            >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ steps.jit.outputs.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ steps.jit.outputs.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ steps.jit.outputs.AWS_SESSION_TOKEN }}
          aws-region: ${{ steps.jit.outputs.AWS_REGION }}

      - name: Prove creds still work
        run: aws sts get-caller-identity
