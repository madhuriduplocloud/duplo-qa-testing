name: DUPLO-11210 — Create Service with Zero Replicas

on:
  workflow_dispatch:
    inputs:
      host:
        description: "DuploCloud portal URL"
        required: true
        default: "https://oneclick.duplocloud.net"
      tenant_name:
        description: "Tenant name"
        required: true
        default: "maja1706"
      service_name:
        description: "Test service name"
        required: false
        default: "zero-replica-test"
      image:
        description: "Container image"
        required: false
        default: "nginx:latest"

env:
  DUPLO_HOST: ${{ github.event.inputs.host }}
  DUPLO_TOKEN: ${{ secrets.DUPLO_TOKEN }}
  TENANT_NAME: ${{ github.event.inputs.tenant_name }}
  SVC: ${{ github.event.inputs.service_name }}
  IMAGE: ${{ github.event.inputs.image }}

jobs:
  create-zero-replicas:
    name: Create service with Replicas=0 and verify behaviour
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate token and resolve tenant ID
        id: tenant
        run: |
          if [ -z "$DUPLO_TOKEN" ]; then
            echo "❌ DUPLO_TOKEN secret is not set."
            exit 1
          fi

          HTTP=$(curl -s -o /tmp/tenants.json -w "%{http_code}" \
            -H "Authorization: Bearer $DUPLO_TOKEN" \
            "${DUPLO_HOST}/v3/admin/tenant")

          if [ "$HTTP" = "401" ]; then
            echo "❌ 401 Unauthorized — DUPLO_TOKEN is invalid or expired."
            exit 1
          elif [ "$HTTP" != "200" ]; then
            echo "❌ Unexpected HTTP $HTTP"
            cat /tmp/tenants.json
            exit 1
          fi

          TENANT_ID=$(python3 - <<'PY'
          import json, sys, os
          tenant = os.environ["TENANT_NAME"].lower()
          data = json.load(open("/tmp/tenants.json"))
          for t in data:
              if t.get("AccountName", "").lower() == tenant:
                  print(t["TenantId"])
                  sys.exit(0)
          print(f"Tenant '{tenant}' not found", file=sys.stderr)
          sys.exit(1)
          PY
          )
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Resolved tenant '${{ github.event.inputs.tenant_name }}' → $TENANT_ID"

      - name: TEST 1 — Create service with Replicas=0
        id: test1
        env:
          TENANT_ID: ${{ steps.tenant.outputs.tenant_id }}
        run: |
          echo "Creating service '${SVC}' with Replicas=0..."
          RESP=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $DUPLO_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "${DUPLO_HOST}/subscriptions/${TENANT_ID}/ReplicationControllerUpdate" \
            -d "{\"Name\":\"${SVC}\",\"DockerImage\":\"${IMAGE}\",\"Replicas\":0,\"AgentPlatform\":7,\"IsDaemonset\":false,\"TenantId\":\"${TENANT_ID}\"}")
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -1)
          echo "  HTTP: $HTTP"
          echo "  Body: $BODY"

          if [ "$HTTP" = "200" ]; then
            echo "  ✅ Service created (API accepted Replicas=0)"
            echo "TEST1_RESULT=PASS" >> "$GITHUB_ENV"
          else
            echo "  ❌ Service creation failed — API rejected Replicas=0 on create"
            echo "TEST1_RESULT=FAIL" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: TEST 2 — Verify service exists with Replicas=0 immediately after creation
        id: test2
        env:
          TENANT_ID: ${{ steps.tenant.outputs.tenant_id }}
        run: |
          # Poll up to 30s for the service to appear
          echo "Waiting for service to appear in GetReplicationControllers..."
          REPLICAS=""
          for attempt in $(seq 1 6); do
            REPLICAS=$(curl -s \
              -H "Authorization: Bearer $DUPLO_TOKEN" \
              "${DUPLO_HOST}/subscriptions/${TENANT_ID}/GetReplicationControllers" | \
              python3 -c "import json,sys; d=json.load(sys.stdin); [print(s['Replicas']) for s in d if s['Name']=='${SVC}']" 2>/dev/null)
            [ -n "$REPLICAS" ] && break
            echo "  Attempt $attempt/6 — service not visible yet, waiting 5s..."
            sleep 5
          done

          echo "  Replicas reported: '$REPLICAS'"
          if [ "$REPLICAS" = "0" ]; then
            echo "  ✅ Service is at Replicas=0 as created"
            echo "TEST2_RESULT=PASS" >> "$GITHUB_ENV"
          else
            echo "  ❌ Expected Replicas=0, got '$REPLICAS'"
            echo "TEST2_RESULT=FAIL" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: TEST 3 — Wait 2 min and verify service stays at 0 (no auto-start)
        id: test3
        env:
          TENANT_ID: ${{ steps.tenant.outputs.tenant_id }}
        run: |
          echo "⏳ Waiting 2 minutes to confirm service is not auto-started..."
          for i in $(seq 120 -10 10); do
            echo "  $i seconds remaining..."
            sleep 10
          done
          echo "✅ Wait complete. Checking replica count..."

          REPLICAS=$(curl -s \
            -H "Authorization: Bearer $DUPLO_TOKEN" \
            "${DUPLO_HOST}/subscriptions/${TENANT_ID}/GetReplicationControllers" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); [print(s['Replicas']) for s in d if s['Name']=='${SVC}']" 2>/dev/null)

          echo "  Replicas after 2 min: '$REPLICAS'"
          if [ "$REPLICAS" = "0" ]; then
            echo "  ✅ Service stayed at Replicas=0 — no auto-start"
            echo "TEST3_RESULT=PASS" >> "$GITHUB_ENV"
          else
            echo "  ❌ Service auto-started to Replicas=$REPLICAS — unexpected!"
            echo "TEST3_RESULT=FAIL" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: TEST 4 — Scale up from 0 to 1 (verify stopped service can be started)
        id: test4
        env:
          TENANT_ID: ${{ steps.tenant.outputs.tenant_id }}
        run: |
          echo "Scaling '${SVC}' from 0 → 1..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $DUPLO_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "${DUPLO_HOST}/subscriptions/${TENANT_ID}/ReplicationControllerChangeAll" \
            -d "{\"Name\":\"${SVC}\",\"Replicas\":1,\"TenantId\":\"${TENANT_ID}\"}")
          echo "  HTTP: $HTTP"

          # Poll up to 60s for replica count to reach 1
          echo "  Waiting for service to reach 1 replica..."
          REPLICAS=""
          for attempt in $(seq 1 12); do
            REPLICAS=$(curl -s \
              -H "Authorization: Bearer $DUPLO_TOKEN" \
              "${DUPLO_HOST}/subscriptions/${TENANT_ID}/GetReplicationControllers" | \
              python3 -c "import json,sys; d=json.load(sys.stdin); [print(s['Replicas']) for s in d if s['Name']=='${SVC}']" 2>/dev/null)
            [ "$REPLICAS" = "1" ] && break
            echo "  Attempt $attempt/12 — Replicas=$REPLICAS, waiting 5s..."
            sleep 5
          done

          if [ "$REPLICAS" = "1" ]; then
            echo "  ✅ Service scaled up to Replicas=1"
            echo "TEST4_RESULT=PASS" >> "$GITHUB_ENV"
          else
            echo "  ❌ Expected Replicas=1, got '$REPLICAS'"
            echo "TEST4_RESULT=FAIL" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Delete test service (cleanup)
        if: always()
        env:
          TENANT_ID: ${{ steps.tenant.outputs.tenant_id }}
        run: |
          echo "Deleting test service '${SVC}'..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $DUPLO_TOKEN" \
            -H "Content-Type: application/json" \
            -X DELETE "${DUPLO_HOST}/subscriptions/${TENANT_ID}/ReplicationControllerUpdate/${SVC}")
          if [ "$HTTP" = "200" ]; then
            echo "  🗑️  Deleted ${SVC}"
          else
            echo "  ⚠️  HTTP $HTTP — service may not exist or already deleted"
          fi

      - name: Write job summary
        if: always()
        run: |
          icon() { [ "$1" = "PASS" ] && echo "✅" || echo "❌"; }

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## DUPLO-11210 — Create Service with Zero Replicas

          **Host:** ${{ github.event.inputs.host }}
          **Tenant:** ${{ github.event.inputs.tenant_name }}
          **Service:** ${{ github.event.inputs.service_name }}
          **Feature flag:** \`EnableDuploServiceScalingToZero\`

          | Test | Description | Result |
          |------|-------------|--------|
          | 1 | Create service with Replicas=0 (API must accept) | $(icon "${TEST1_RESULT:-SKIP}") ${TEST1_RESULT:-SKIP} |
          | 2 | Verify service reports Replicas=0 immediately | $(icon "${TEST2_RESULT:-SKIP}") ${TEST2_RESULT:-SKIP} |
          | 3 | Wait 2 min — service must not auto-start | $(icon "${TEST3_RESULT:-SKIP}") ${TEST3_RESULT:-SKIP} |
          | 4 | Scale 0→1 — stopped service can be started | $(icon "${TEST4_RESULT:-SKIP}") ${TEST4_RESULT:-SKIP} |
          EOF
