name: DUPLO-11210 — Create Services with Zero Replicas (Bulk)

on:
  workflow_dispatch:
    inputs:
      host:
        description: "DuploCloud portal URL"
        required: true
        default: "https://oneclick.duplocloud.net"
      tenant_name:
        description: "Tenant name"
        required: true
        default: "maja1706"
      service_prefix:
        description: "Service name prefix (services named <prefix>-01 to <prefix>-N)"
        required: false
        default: "zero-create"
      service_count:
        description: "Number of services to create with Replicas=0 (max 10)"
        required: false
        default: "10"
      image:
        description: "Container image"
        required: false
        default: "nginx:latest"

env:
  DUPLO_HOST: ${{ github.event.inputs.host }}
  DUPLO_TOKEN: ${{ secrets.DUPLO_TOKEN }}
  TENANT_NAME: ${{ github.event.inputs.tenant_name }}
  PREFIX: ${{ github.event.inputs.service_prefix }}
  COUNT: ${{ github.event.inputs.service_count }}
  IMAGE: ${{ github.event.inputs.image }}

jobs:
  create-zero-replicas:
    name: Create ${{ github.event.inputs.service_count }} services with Replicas=0 and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate token and resolve tenant ID
        id: tenant
        run: |
          if [ -z "$DUPLO_TOKEN" ]; then
            echo "❌ DUPLO_TOKEN secret is not set."; exit 1
          fi
          HTTP=$(curl -s -o /tmp/tenants.json -w "%{http_code}" \
            -H "Authorization: Bearer $DUPLO_TOKEN" \
            "${DUPLO_HOST}/v3/admin/tenant")
          if [ "$HTTP" = "401" ]; then
            echo "❌ 401 Unauthorized — DUPLO_TOKEN is invalid or expired."; exit 1
          elif [ "$HTTP" != "200" ]; then
            echo "❌ Unexpected HTTP $HTTP"; cat /tmp/tenants.json; exit 1
          fi
          TENANT_ID=$(python3 - <<'PY'
          import json, sys, os
          tenant = os.environ["TENANT_NAME"].lower()
          data = json.load(open("/tmp/tenants.json"))
          for t in data:
              if t.get("AccountName", "").lower() == tenant:
                  print(t["TenantId"]); sys.exit(0)
          print(f"Tenant '{tenant}' not found", file=sys.stderr); sys.exit(1)
          PY
          )
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "TENANT_ID=$TENANT_ID" >> "$GITHUB_ENV"
          echo "✅ Resolved tenant '${{ github.event.inputs.tenant_name }}' → $TENANT_ID"

      # ── TEST 1: Create all services with Replicas=0 ───────────────────────
      - name: TEST 1 — Create ${{ github.event.inputs.service_count }} services with Replicas=0
        id: test1
        env:
          TENANT_ID: ${{ steps.tenant.outputs.tenant_id }}
        run: |
          echo "Creating ${COUNT} services with Replicas=0..."
          PASS=0; FAIL=0
          for i in $(seq -f "%02g" 1 ${COUNT}); do
            NAME="${PREFIX}-${i}"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $DUPLO_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST "${DUPLO_HOST}/subscriptions/${TENANT_ID}/ReplicationControllerUpdate" \
              -d "{\"Name\":\"${NAME}\",\"DockerImage\":\"${IMAGE}\",\"Replicas\":0,\"AgentPlatform\":7,\"IsDaemonset\":false,\"TenantId\":\"${TENANT_ID}\"}")
            if [ "$HTTP" = "200" ]; then
              echo "  ✅ $NAME created (Replicas=0)"
              PASS=$((PASS+1))
            else
              echo "  ❌ $NAME failed — HTTP $HTTP"
              FAIL=$((FAIL+1))
            fi
          done
          echo "TEST1_PASS=$PASS" >> "$GITHUB_ENV"
          echo "TEST1_FAIL=$FAIL" >> "$GITHUB_ENV"
          echo "Test 1 — Created: $PASS  Failed: $FAIL"
          [ "$FAIL" -eq 0 ] || exit 1

      # ── TEST 2: Verify all services report Replicas=0 ────────────────────
      - name: TEST 2 — Verify all ${{ github.event.inputs.service_count }} services report Replicas=0
        id: test2
        env:
          TENANT_ID: ${{ steps.tenant.outputs.tenant_id }}
        run: |
          echo "Polling until all services appear at Replicas=0 (up to 60s)..."
          for attempt in $(seq 1 12); do
            NOT_READY=0
            for i in $(seq -f "%02g" 1 ${COUNT}); do
              R=$(curl -s -H "Authorization: Bearer $DUPLO_TOKEN" \
                "${DUPLO_HOST}/subscriptions/${TENANT_ID}/GetReplicationControllers" | \
                python3 -c "import json,sys; d=json.load(sys.stdin); [print(s['Replicas']) for s in d if s['Name']=='${PREFIX}-${i}']" 2>/dev/null)
              [ "$R" != "0" ] && NOT_READY=$((NOT_READY+1))
            done
            [ "$NOT_READY" -eq 0 ] && break
            echo "  Attempt $attempt/12 — $NOT_READY service(s) not yet at 0, waiting 5s..."
            sleep 5
          done

          PASS=0; FAIL=0
          for i in $(seq -f "%02g" 1 ${COUNT}); do
            NAME="${PREFIX}-${i}"
            R=$(curl -s -H "Authorization: Bearer $DUPLO_TOKEN" \
              "${DUPLO_HOST}/subscriptions/${TENANT_ID}/GetReplicationControllers" | \
              python3 -c "import json,sys; d=json.load(sys.stdin); [print(s['Replicas']) for s in d if s['Name']=='${NAME}']" 2>/dev/null)
            if [ "$R" = "0" ]; then
              echo "  ✅ $NAME: Replicas=0"
              PASS=$((PASS+1))
            else
              echo "  ❌ $NAME: Expected 0, got '$R'"
              FAIL=$((FAIL+1))
            fi
          done
          echo "TEST2_PASS=$PASS" >> "$GITHUB_ENV"
          echo "TEST2_FAIL=$FAIL" >> "$GITHUB_ENV"
          echo "Test 2 — PASS: $PASS  FAIL: $FAIL"
          [ "$FAIL" -eq 0 ] || exit 1

      # ── TEST 3: Wait 2 min — all services must stay at 0 (no auto-start) ─
      - name: TEST 3 — Wait 2 min — all services must not auto-start
        id: test3
        env:
          TENANT_ID: ${{ steps.tenant.outputs.tenant_id }}
        run: |
          echo "⏳ Waiting 2 minutes to verify no service auto-starts..."
          for i in $(seq 120 -10 10); do echo "  $i seconds remaining..."; sleep 10; done
          echo "✅ Wait complete. Checking all ${COUNT} services..."

          PASS=0; FAIL=0
          for i in $(seq -f "%02g" 1 ${COUNT}); do
            NAME="${PREFIX}-${i}"
            R=$(curl -s -H "Authorization: Bearer $DUPLO_TOKEN" \
              "${DUPLO_HOST}/subscriptions/${TENANT_ID}/GetReplicationControllers" | \
              python3 -c "import json,sys; d=json.load(sys.stdin); [print(s['Replicas']) for s in d if s['Name']=='${NAME}']" 2>/dev/null)
            if [ "$R" = "0" ]; then
              echo "  ✅ $NAME: still Replicas=0 (not auto-started)"
              PASS=$((PASS+1))
            else
              echo "  ❌ $NAME: auto-started to Replicas=$R — unexpected!"
              FAIL=$((FAIL+1))
            fi
          done
          echo "TEST3_PASS=$PASS" >> "$GITHUB_ENV"
          echo "TEST3_FAIL=$FAIL" >> "$GITHUB_ENV"
          echo "Test 3 — PASS: $PASS  FAIL: $FAIL"
          [ "$FAIL" -eq 0 ] || exit 1

      # ── TEST 4: Bulk scale all services 0→1 via BulkChange ───────────────
      - name: TEST 4 — BulkChange all ${{ github.event.inputs.service_count }} services 0→1
        id: test4
        env:
          TENANT_ID: ${{ steps.tenant.outputs.tenant_id }}
        run: |
          PAYLOAD=$(python3 -c "
          import json, os
          count  = int(os.environ['COUNT'])
          prefix = os.environ['PREFIX']
          tid    = os.environ['TENANT_ID']
          svcs   = [{'Name': f'{prefix}-{i:02d}', 'Replicas': 1, 'TenantId': tid} for i in range(1, count+1)]
          print(json.dumps(svcs))
          ")

          echo "Sending BulkChange for ${COUNT} services → 1"
          HTTP=$(curl -s -o /tmp/bulk_tc4.json -w "%{http_code}" \
            -H "Authorization: Bearer $DUPLO_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "${DUPLO_HOST}/subscriptions/${TENANT_ID}/ReplicationControllerBulkChange" \
            -d "$PAYLOAD")
          echo "  HTTP: $HTTP"

          for attempt in $(seq 1 12); do
            NOT_READY=0
            for i in $(seq -f "%02g" 1 ${COUNT}); do
              R=$(curl -s -H "Authorization: Bearer $DUPLO_TOKEN" \
                "${DUPLO_HOST}/subscriptions/${TENANT_ID}/GetReplicationControllers" | \
                python3 -c "import json,sys; d=json.load(sys.stdin); [print(s['Replicas']) for s in d if s['Name']=='${PREFIX}-${i}']" 2>/dev/null)
              [ "$R" != "1" ] && NOT_READY=$((NOT_READY+1))
            done
            [ "$NOT_READY" -eq 0 ] && break
            echo "  Attempt $attempt/12 — $NOT_READY not at 1, waiting 5s..."; sleep 5
          done

          PASS=0; FAIL=0
          for i in $(seq -f "%02g" 1 ${COUNT}); do
            NAME="${PREFIX}-${i}"
            R=$(curl -s -H "Authorization: Bearer $DUPLO_TOKEN" \
              "${DUPLO_HOST}/subscriptions/${TENANT_ID}/GetReplicationControllers" | \
              python3 -c "import json,sys; d=json.load(sys.stdin); [print(s['Replicas']) for s in d if s['Name']=='${NAME}']" 2>/dev/null)
            if [ "$R" = "1" ]; then
              echo "  ✅ $NAME: Replicas=1"
              PASS=$((PASS+1))
            else
              echo "  ❌ $NAME: Expected 1, got '$R'"
              FAIL=$((FAIL+1))
            fi
          done
          echo "TEST4_PASS=$PASS" >> "$GITHUB_ENV"
          echo "TEST4_FAIL=$FAIL" >> "$GITHUB_ENV"
          echo "Test 4 — PASS: $PASS  FAIL: $FAIL"
          [ "$FAIL" -eq 0 ] || exit 1

      # ── Cleanup ───────────────────────────────────────────────────────────
      - name: Delete all test services (cleanup)
        if: always()
        run: |
          pip install -q duplocloud-client
          DC="duploctl --host $DUPLO_HOST --token $DUPLO_TOKEN --tenant $TENANT_NAME"
          echo "Deleting ${COUNT} test services..."
          for i in $(seq -f "%02g" 1 ${COUNT}); do
            NAME="${PREFIX}-${i}"
            if $DC service delete "$NAME" > /dev/null 2>&1; then
              echo "  🗑️  Deleted $NAME"
            else
              echo "  ⚠️  Could not delete $NAME (may not exist)"
            fi
          done

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          result() {
            case "$1" in PASS*) echo "✅ $1";; FAIL*) echo "❌ $1";; *) echo "⏭️  SKIP";; esac
          }

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## DUPLO-11210 — Create ${{ github.event.inputs.service_count }} Services with Replicas=0

          **Host:** ${{ github.event.inputs.host }}
          **Tenant:** ${{ github.event.inputs.tenant_name }}
          **Services:** ${{ github.event.inputs.service_prefix }}-01 to ${{ github.event.inputs.service_prefix }}-${{ github.event.inputs.service_count }}
          **Feature flag:** \`EnableDuploServiceScalingToZero\`

          | Test | Description | Result |
          |------|-------------|--------|
          | 1 | Create ${{ github.event.inputs.service_count }} services with Replicas=0 (API must accept) | $(result "${TEST1_PASS:+PASS (${TEST1_PASS}/${{ github.event.inputs.service_count }})}${TEST1_FAIL:+FAIL (${TEST1_FAIL} failed)}") |
          | 2 | All services report Replicas=0 immediately after creation | $(result "${TEST2_PASS:+PASS (${TEST2_PASS}/${{ github.event.inputs.service_count }})}${TEST2_FAIL:+FAIL (${TEST2_FAIL} failed)}") |
          | 3 | Wait 2 min — no service auto-starts | $(result "${TEST3_PASS:+PASS (${TEST3_PASS}/${{ github.event.inputs.service_count }})}${TEST3_FAIL:+FAIL (${TEST3_FAIL} failed)}") |
          | 4 | BulkChange all services 0→1 (can be started after created stopped) | $(result "${TEST4_PASS:+PASS (${TEST4_PASS}/${{ github.event.inputs.service_count }})}${TEST4_FAIL:+FAIL (${TEST4_FAIL} failed)}") |
          EOF
