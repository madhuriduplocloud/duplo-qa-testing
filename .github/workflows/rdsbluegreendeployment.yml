name: RDS Blue/Green Deployment — Full E2E Validation

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "DuploCloud tenant name"
        required: true
        default: "maja2505"
      rds_name:
        description: "RDS short name (DuploCloud name, without duplo prefix)"
        required: true
        default: "maja-bgtest"
      region:
        description: "AWS region"
        required: false
        default: "us-east-2"
      engine_version:
        description: "Aurora PostgreSQL engine version"
        required: false
        default: "16.6"
      monitor_duration:
        description: "Phase 3 monitoring duration in seconds (default 3600 = 60 min)"
        required: false
        default: "3600"
      monitor_interval:
        description: "Phase 3 monitoring poll interval in seconds"
        required: false
        default: "60"
      skip_rds_create:
        description: "true = skip Phase 0, use existing RDS instance"
        required: false
        default: "false"
      test_case:
        description: |
          Which test case to run:
            positive-cli    = BUG1 fix check: create via CLI, verify DuploCloud does NOT delete it
            positive-api    = BUG2 fix check: create via API, verify Green cluster is NOT deleted
            positive-e2e    = Full E2E happy path via API (create → switchover → cleanup)
            negative-no-replication = Switchover without logical replication enabled (expect graceful error)
            negative-already-exists = Create B/G when one already exists (expect graceful error)
            negative-invalid-version = Create B/G with invalid engine version (expect graceful error)
        required: true
        default: "positive-e2e"

jobs:
  bluegreen-e2e:
    runs-on: ubuntu-latest
    environment: qa-aws
    timeout-minutes: 150

    env:
      DUPLO_HOST:   ${{ vars.DUPLO_HOST }}
      DUPLO_TOKEN:  ${{ secrets.DUPLO_TOKEN }}
      PGPASSWORD:   ${{ secrets.PGPASSWORD }}
      AWS_REGION:   ${{ inputs.region }}
      DUPLO_TENANT: ${{ inputs.tenant }}
      RDS_NAME:     ${{ inputs.rds_name }}
      TEST_CASE:    ${{ inputs.test_case }}

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client jq netcat-openbsd
          pip3 install duplocloud-client==0.4.3
          chmod +x validate_rds_blue_green.sh

      # -----------------------------------------------------------------------
      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ inputs.region }}

      # -----------------------------------------------------------------------
      - name: Phase 0 — Create RDS Instance
        if: inputs.skip_rds_create != 'true'
        run: |
          bash validate_rds_blue_green.sh \
            --duplo-host    "$DUPLO_HOST"   \
            --duplo-token   "$DUPLO_TOKEN"  \
            --duplo-tenant  "$DUPLO_TENANT" \
            --region        "$AWS_REGION"   \
            --create-rds                    \
            --rds-identifier    "$RDS_NAME" \
            --rds-master-user   pgadmin     \
            --rds-master-pass   "${{ secrets.RDS_MASTER_PASSWORD }}" \
            --rds-engine-version "${{ inputs.engine_version }}"

      # -----------------------------------------------------------------------
      - name: Resolve Blue instance and confirm available
        id: resolve
        run: |
          BLUE_INSTANCE="${RDS_NAME}"
          echo "blue_instance=${BLUE_INSTANCE}" >> "$GITHUB_OUTPUT"
          echo "Blue instance: ${BLUE_INSTANCE}"

          for i in $(seq 1 10); do
            STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier "$BLUE_INSTANCE" \
              --query 'DBInstances[0].DBInstanceStatus' \
              --output text --region "$AWS_REGION" 2>/dev/null || echo "not-found")
            echo "  [${i}] status: $STATUS"
            [[ "$STATUS" == "available" ]] && break
            [[ "$STATUS" == "not-found" ]] && { echo "ERROR: $BLUE_INSTANCE not found"; exit 1; }
            sleep 30
          done

          if [[ "$STATUS" != "available" ]]; then
            echo "ERROR: $BLUE_INSTANCE is not available (status: $STATUS)"
            exit 1
          fi

          CLUSTER_ID=$(aws rds describe-db-instances \
            --db-instance-identifier "$BLUE_INSTANCE" \
            --query 'DBInstances[0].DBClusterIdentifier' \
            --output text --region "$AWS_REGION")
          echo "cluster_id=${CLUSTER_ID}" >> "$GITHUB_OUTPUT"
          echo "Blue cluster: ${CLUSTER_ID}"

      # =======================================================================
      # NEGATIVE TEST: No logical replication
      # Disable rds.logical_replication, attempt switchover, expect graceful error
      # =======================================================================
      - name: "[NEG] Disable logical replication"
        if: env.TEST_CASE == 'negative-no-replication'
        run: |
          echo "Disabling rds.logical_replication to simulate missing prerequisite..."
          PARAM_GROUP=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_NAME" \
            --query 'DBInstances[0].DBParameterGroups[0].DBParameterGroupName' \
            --output text --region "$AWS_REGION")
          echo "Parameter group: $PARAM_GROUP"
          aws rds modify-db-parameter-group \
            --db-parameter-group-name "$PARAM_GROUP" \
            --parameters "ParameterName=rds.logical_replication,ParameterValue=0,ApplyMethod=pending-reboot" \
            --region "$AWS_REGION"
          echo "Rebooting instance to apply..."
          aws rds reboot-db-instance --db-instance-identifier "$RDS_NAME" --region "$AWS_REGION"
          for i in $(seq 1 20); do
            STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier "$RDS_NAME" \
              --query 'DBInstances[0].DBInstanceStatus' \
              --output text --region "$AWS_REGION")
            echo "  [${i}] status: $STATUS"
            [[ "$STATUS" == "available" ]] && break
            sleep 30
          done

      # =======================================================================
      # NEGATIVE TEST: Already exists
      # Create a B/G deployment first, then try to create another one
      # =======================================================================
      - name: "[NEG] Create first B/G deployment (setup for already-exists test)"
        if: env.TEST_CASE == 'negative-already-exists'
        id: neg_first_bg
        run: |
          TENANT_ID=$(curl -s -H "Authorization: Bearer $DUPLO_TOKEN" \
            "$DUPLO_HOST/v3/admin/tenant" | \
            jq -r --arg t "$DUPLO_TENANT" '.[] | select(.AccountName | ascii_downcase == ($t | ascii_downcase)) | .TenantId')
          CLUSTER_ID="${{ steps.resolve.outputs.cluster_id }}"

          BG_JSON=$(curl -s -X POST \
            -H "Authorization: Bearer $DUPLO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"TargetEngineVersion\":\"${{ inputs.engine_version }}\"}" \
            "$DUPLO_HOST/v3/subscriptions/$TENANT_ID/aws/rds/cluster/$CLUSTER_ID/bluegreen")
          echo "First deployment response: $BG_JSON"
          DEPLOYMENT_ID=$(echo "$BG_JSON" | jq -r '.DeploymentId // empty')
          echo "first_deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Create Blue/Green Deployment (all cases except negative-already-exists second attempt)
      # -----------------------------------------------------------------------
      - name: Create Blue/Green Deployment
        id: create_bg
        run: |
          CLUSTER_ID="${{ steps.resolve.outputs.cluster_id }}"

          TENANT_ID=$(curl -s -H "Authorization: Bearer $DUPLO_TOKEN" \
            "$DUPLO_HOST/v3/admin/tenant" | \
            jq -r --arg t "$DUPLO_TENANT" '.[] | select(.AccountName | ascii_downcase == ($t | ascii_downcase)) | .TenantId')
          echo "Tenant ID: $TENANT_ID"

          # ---- NEGATIVE: invalid engine version ----
          if [[ "$TEST_CASE" == "negative-invalid-version" ]]; then
            echo "Testing with invalid engine version 99.99 — expecting API error..."
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $DUPLO_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"TargetEngineVersion":"99.99"}' \
              "$DUPLO_HOST/v3/subscriptions/$TENANT_ID/aws/rds/cluster/$CLUSTER_ID/bluegreen")
            echo "Response: $RESPONSE"
            ERROR=$(echo "$RESPONSE" | jq -r '.error // .Error // .message // empty')
            if [[ -n "$ERROR" ]]; then
              echo "PASS: API returned expected error: $ERROR"
              exit 0
            else
              echo "FAIL: Expected an error for invalid engine version but got: $RESPONSE"
              exit 1
            fi
          fi

          # ---- NEGATIVE: already exists — attempt second deployment ----
          if [[ "$TEST_CASE" == "negative-already-exists" ]]; then
            echo "Attempting to create second B/G deployment while one already exists..."
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $DUPLO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"TargetEngineVersion\":\"${{ inputs.engine_version }}\"}" \
              "$DUPLO_HOST/v3/subscriptions/$TENANT_ID/aws/rds/cluster/$CLUSTER_ID/bluegreen")
            echo "Response: $RESPONSE"
            ERROR=$(echo "$RESPONSE" | jq -r '.error // .Error // .message // empty')
            if [[ -n "$ERROR" ]]; then
              echo "PASS: API returned expected error for duplicate deployment: $ERROR"
              exit 0
            else
              echo "FAIL: Expected an error for duplicate B/G deployment but got: $RESPONSE"
              exit 1
            fi
          fi

          # ---- POSITIVE CLI: create via AWS CLI (BUG1 fix check) ----
          if [[ "$TEST_CASE" == "positive-cli" ]]; then
            echo "Creating B/G deployment via AWS CLI (BUG1 fix verification)..."
            CLUSTER_ARN=$(aws rds describe-db-clusters \
              --db-cluster-identifier "$CLUSTER_ID" \
              --query 'DBClusters[0].DBClusterArn' \
              --output text --region "$AWS_REGION")
            BG_JSON=$(aws rds create-blue-green-deployment \
              --blue-green-deployment-name "${RDS_NAME}-bg-cli-test" \
              --source "$CLUSTER_ARN" \
              --target-engine-version "${{ inputs.engine_version }}" \
              --region "$AWS_REGION" --output json)
            echo "AWS CLI response: $BG_JSON"
            DEPLOYMENT_ID=$(echo "$BG_JSON" | jq -r '.BlueGreenDeployment.BlueGreenDeploymentIdentifier')

          # ---- POSITIVE API / E2E: create via DuploCloud API (BUG2 fix check) ----
          else
            echo "Creating B/G deployment via DuploCloud API..."
            BG_JSON=$(curl -s -X POST \
              -H "Authorization: Bearer $DUPLO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"TargetEngineVersion\":\"${{ inputs.engine_version }}\"}" \
              "$DUPLO_HOST/v3/subscriptions/$TENANT_ID/aws/rds/cluster/$CLUSTER_ID/bluegreen")
            echo "DuploCloud response: $BG_JSON"
            DEPLOYMENT_ID=$(echo "$BG_JSON" | jq -r '.DeploymentId')
          fi

          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "Deployment created: $DEPLOYMENT_ID"

          # Wait for AVAILABLE (up to 35 min)
          echo "Waiting for Blue/Green deployment to become AVAILABLE..."
          for i in $(seq 1 70); do
            STATUS=$(aws rds describe-blue-green-deployments \
              --blue-green-deployment-identifier "$DEPLOYMENT_ID" \
              --query 'BlueGreenDeployments[0].Status' \
              --output text --region "$AWS_REGION" 2>/dev/null || echo "")
            echo "  [$((i * 30))s] Status: $STATUS"
            [[ "$STATUS" == "AVAILABLE" ]] && break
            if [[ "$STATUS" == "INVALID_CONFIGURATION" || "$STATUS" == "CREATE_FAILED" ]]; then
              echo "ERROR: Deployment failed — Status: $STATUS"
              exit 1
            fi
            sleep 30
          done

          if [[ "$STATUS" != "AVAILABLE" ]]; then
            echo "ERROR: Deployment did not become AVAILABLE within 35 minutes"
            exit 1
          fi

          GREEN_INSTANCE=$(aws rds describe-blue-green-deployments \
            --blue-green-deployment-identifier "$DEPLOYMENT_ID" \
            --region "$AWS_REGION" \
            --query 'BlueGreenDeployments[0].SwitchoverDetails[*].TargetMember' \
            --output text | tr '\t' '\n' | grep ':db:' | sed 's/.*:db://' | head -1)
          echo "green_instance=${GREEN_INSTANCE}" >> "$GITHUB_OUTPUT"
          echo "Green instance: $GREEN_INSTANCE"

      # =======================================================================
      # POSITIVE CLI — BUG1 Fix Verification
      # Monitor for 5 min to confirm DuploCloud does NOT delete the CLI-created deployment
      # =======================================================================
      - name: "[POS-CLI] Verify DuploCloud does NOT delete CLI-created deployment (BUG1 fix check)"
        if: env.TEST_CASE == 'positive-cli'
        run: |
          DEPLOYMENT_ID="${{ steps.create_bg.outputs.deployment_id }}"
          echo "Monitoring deployment $DEPLOYMENT_ID for 5 minutes to verify it is NOT deleted..."
          echo "If DuploCloud deletes it, this step will FAIL — BUG1 is NOT fixed."
          echo ""

          for i in $(seq 1 10); do
            STATUS=$(aws rds describe-blue-green-deployments \
              --blue-green-deployment-identifier "$DEPLOYMENT_ID" \
              --query 'BlueGreenDeployments[0].Status' \
              --output text --region "$AWS_REGION" 2>/dev/null || echo "DELETED")
            echo "  [${i}/10] $((i * 30))s — Status: $STATUS"

            if [[ "$STATUS" == "DELETED" || -z "$STATUS" ]]; then
              echo ""
              echo "FAIL: Deployment was deleted by DuploCloud — BUG1 is NOT fixed!"
              exit 1
            fi
            sleep 30
          done

          echo ""
          echo "PASS: Deployment survived 5 minutes without being deleted by DuploCloud — BUG1 is FIXED!"

      # =======================================================================
      # POSITIVE API — BUG2 Fix Verification
      # Monitor Green cluster for 5 min to confirm DuploCloud does NOT delete it
      # =======================================================================
      - name: "[POS-API] Verify Green cluster is NOT deleted by DuploCloud (BUG2 fix check)"
        if: env.TEST_CASE == 'positive-api'
        run: |
          DEPLOYMENT_ID="${{ steps.create_bg.outputs.deployment_id }}"
          echo "Fetching Green cluster name..."
          GREEN_CLUSTER=$(aws rds describe-blue-green-deployments \
            --blue-green-deployment-identifier "$DEPLOYMENT_ID" \
            --region "$AWS_REGION" \
            --query 'BlueGreenDeployments[0].Target' \
            --output text 2>/dev/null | sed 's/.*:cluster://')
          echo "Green cluster: $GREEN_CLUSTER"
          echo ""
          echo "Monitoring Green cluster for 5 minutes to verify it is NOT deleted..."
          echo "If DuploCloud deletes it, this step will FAIL — BUG2 is NOT fixed."
          echo ""

          for i in $(seq 1 10); do
            STATUS=$(aws rds describe-db-clusters \
              --db-cluster-identifier "$GREEN_CLUSTER" \
              --query 'DBClusters[0].Status' \
              --output text --region "$AWS_REGION" 2>/dev/null || echo "DELETED")
            echo "  [${i}/10] $((i * 30))s — Green cluster status: $STATUS"

            if [[ "$STATUS" == "DELETED" || -z "$STATUS" ]]; then
              echo ""
              echo "FAIL: Green cluster was deleted by DuploCloud — BUG2 is NOT fixed!"
              exit 1
            fi
            sleep 30
          done

          echo ""
          echo "PASS: Green cluster survived 5 minutes without being deleted — BUG2 is FIXED!"

      # -----------------------------------------------------------------------
      - name: Phase 1 — Pre-Switchover Validation
        if: env.TEST_CASE == 'positive-e2e' || env.TEST_CASE == 'negative-no-replication'
        run: |
          bash validate_rds_blue_green.sh \
            --blue-instance  "${{ steps.resolve.outputs.blue_instance }}"  \
            --green-instance "${{ steps.create_bg.outputs.green_instance }}" \
            --deployment-id  "${{ steps.create_bg.outputs.deployment_id }}" \
            --duplo-host     "$DUPLO_HOST"   \
            --duplo-token    "$DUPLO_TOKEN"  \
            --duplo-tenant   "$DUPLO_TENANT" \
            --region         "$AWS_REGION"   \
            --db-user        pgadmin         \
            --db-name        postgres        \
            --phase          pre

      # -----------------------------------------------------------------------
      - name: Switchover — Promote Green to Primary
        id: switchover
        if: env.TEST_CASE == 'positive-e2e' || env.TEST_CASE == 'negative-no-replication'
        run: |
          DEPLOYMENT_ID="${{ steps.create_bg.outputs.deployment_id }}"
          echo "Initiating switchover for $DEPLOYMENT_ID ..."

          # NEGATIVE: no-replication test expects this to fail
          if [[ "$TEST_CASE" == "negative-no-replication" ]]; then
            echo "Expecting switchover to fail due to missing logical replication..."
            set +e
            aws rds switchover-blue-green-deployment \
              --blue-green-deployment-identifier "$DEPLOYMENT_ID" \
              --switchover-timeout 300 \
              --region "$AWS_REGION" 2>&1
            EXIT_CODE=$?
            set -e
            if [[ $EXIT_CODE -ne 0 ]]; then
              echo "PASS: Switchover failed as expected due to missing logical replication."
              exit 0
            else
              echo "FAIL: Switchover succeeded but should have failed without logical replication."
              exit 1
            fi
          fi

          aws rds switchover-blue-green-deployment \
            --blue-green-deployment-identifier "$DEPLOYMENT_ID" \
            --switchover-timeout 300 \
            --region "$AWS_REGION"

          echo "Waiting for switchover to complete..."
          for i in $(seq 1 20); do
            STATUS=$(aws rds describe-blue-green-deployments \
              --blue-green-deployment-identifier "$DEPLOYMENT_ID" \
              --query 'BlueGreenDeployments[0].Status' \
              --output text --region "$AWS_REGION" 2>/dev/null || echo "")
            echo "  [$((i * 15))s] Status: $STATUS"
            [[ "$STATUS" == "SWITCHOVER_COMPLETED" ]] && break
            sleep 15
          done

          if [[ "$STATUS" != "SWITCHOVER_COMPLETED" ]]; then
            echo "ERROR: Switchover did not complete within 5 minutes (status: $STATUS)"
            exit 1
          fi
          echo "Switchover completed successfully."

      # -----------------------------------------------------------------------
      - name: Phase 2 + 3 — Post-Switchover Validation + Monitoring
        if: env.TEST_CASE == 'positive-e2e'
        run: |
          bash validate_rds_blue_green.sh \
            --blue-instance  "${{ steps.resolve.outputs.blue_instance }}"    \
            --green-instance "${{ steps.create_bg.outputs.green_instance }}"  \
            --deployment-id  "${{ steps.create_bg.outputs.deployment_id }}"   \
            --duplo-host     "$DUPLO_HOST"   \
            --duplo-token    "$DUPLO_TOKEN"  \
            --duplo-tenant   "$DUPLO_TENANT" \
            --region         "$AWS_REGION"   \
            --db-user        pgadmin         \
            --db-name        postgres        \
            --monitor-duration "${{ inputs.monitor_duration }}" \
            --monitor-interval "${{ inputs.monitor_interval }}" \
            --phase          post+monitor

      # -----------------------------------------------------------------------
      - name: Phase 4 — Cleanup and Delete RDS
        if: always()
        run: |
          bash validate_rds_blue_green.sh \
            --blue-instance  "${{ steps.resolve.outputs.blue_instance }}"    \
            --green-instance "${{ steps.create_bg.outputs.green_instance }}"  \
            --deployment-id  "${{ steps.create_bg.outputs.deployment_id }}"   \
            --duplo-host     "$DUPLO_HOST"   \
            --duplo-token    "$DUPLO_TOKEN"  \
            --duplo-tenant   "$DUPLO_TENANT" \
            --region         "$AWS_REGION"   \
            --db-user        pgadmin         \
            --db-name        postgres        \
            --phase          cleanup         \
            --delete-rds

      # -----------------------------------------------------------------------
      - name: Upload Validation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rds-bluegreen-validation-${{ github.run_number }}
          path: /tmp/rds_bg_reports/
          retention-days: 30
