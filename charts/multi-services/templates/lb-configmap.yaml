{{- if .Values.duploLB.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-lb-script
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  attach_lb.py: |
    import os, sys, requests

    host       = os.environ["DUPLO_HOST"]
    tenant_id  = os.environ["TENANT_ID"]
    cert_arn   = os.environ["CERT_ARN"]
    ext_port   = int(os.environ["EXTERNAL_PORT"])
    protocol   = os.environ["PROTOCOL"]
    prefix     = os.environ["NAME_PREFIX"]
    count      = int(os.environ["SERVICE_COUNT"])
    cont_port  = os.environ["CONTAINER_PORT"]
    token      = os.environ["DUPLO_TOKEN"]

    headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
    url = f"{host}/subscriptions/{tenant_id}/LBConfigurationUpdate"

    ok = fail = 0
    for i in range(1, count + 1):
        name = f"{prefix}{i}"
        payload = {
            "LbType": 1,
            "Port": cont_port,
            "ExternalPort": ext_port,
            "IsInternal": False,
            "IsNative": False,
            "Protocol": protocol,
            "CertificateArn": cert_arn,
            "HealthCheckUrl": "/",
            "BeProtocolVersion": "HTTP1",
            "ReplicationControllerName": name,
        }
        r = requests.post(url, json=payload, headers=headers, timeout=30)
        if r.status_code in (200, 204):
            print(f"[OK]   {name} – ALB {protocol}:{ext_port} attached")
            ok += 1
        else:
            print(f"[FAIL] {name} – HTTP {r.status_code}: {r.text[:120]}", file=sys.stderr)
            fail += 1

    print(f"\nDone: {ok} OK  {fail} failed")
    if fail:
        sys.exit(1)
{{- end }}
